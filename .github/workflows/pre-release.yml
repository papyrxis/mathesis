name: Pre-release

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - ".editorconfig"
      - ".gitignore"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Step 1 — compile every booklet (delegated to reusable workflow)
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build (reusable)
    uses: ./.github/workflows/build.yml
    with:
      version: "latest-pre-release"

  # ─────────────────────────────────────────────────────────────────────────
  # Step 2 — publish pre-release
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish Pre-release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for tag push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download booklet PDFs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.booklets-artifact }}
          path: dist/booklets

      - name: List files to be released
        run: |
          echo "=== Booklets ===" && ls -lh dist/booklets/

      - name: Move latest-pre-release tag to HEAD
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest-pre-release HEAD
          git push origin -f latest-pre-release

      - name: Generate release notes
        id: notes
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"

          # Order by booklet slug (01-, 02-, ... 14-), not alphabetically by
          # output filename — "Abstract Algebra" would otherwise sort before
          # "Mathematical Logic" even though it's booklet 04, not 01. Also
          # write the same order to ordered_files.txt so the release's
          # Assets list matches, instead of gh's default alphabetical sort.
          EN_LIST=""
          FA_LIST=""
          > ordered_files.txt

          for conf in $(ls configs/booklets/*-en.conf | sort); do
            name="$(grep '^OUTPUT_NAME=' "$conf" | sed -E 's/OUTPUT_NAME="(.*)"/\1/')"
            f="dist/booklets/${name}.pdf"
            if [ -f "$f" ]; then
              EN_LIST="${EN_LIST}- $(basename "$f")\n"
              echo "$f" >> ordered_files.txt
            fi
          done

          for conf in $(ls configs/booklets/*-fa.conf | sort); do
            name="$(grep '^OUTPUT_NAME=' "$conf" | sed -E 's/OUTPUT_NAME="(.*)"/\1/')"
            f="dist/booklets/${name}.pdf"
            if [ -f "$f" ]; then
              FA_LIST="${FA_LIST}- $(basename "$f")\n"
              echo "$f" >> ordered_files.txt
            fi
          done

          cat > release_body.md << EOF
          ## 📖 Latest Pre-release Build

          > **این یک نسخه پیش‌انتشار است.** آخرین build از شاخه اصلی — پایدار نیست.
          > *This is a rolling pre-release — the latest build from \`main\`, not a stable version.*

          | | |
          |---|---|
          | **Commit** | [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Built** | ${BUILD_TIME} |
          | **Triggered by** | ${{ github.actor }} |

          ---

          ### 📘 English Booklets

          $(echo -e "$EN_LIST")

          ### 📕 کتابچه‌های فارسی / Persian Booklets

          $(echo -e "$FA_LIST")

          ---

          > برای نسخه پایدار منتظر تگ \`vX.Y.Z\` باشید.
          > For a stable version, wait for a \`vX.Y.Z\` tag release.
          EOF

          echo "Generated release body:"
          cat release_body.md

      - name: Delete existing latest-pre-release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-pre-release --yes 2>/dev/null || true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-pre-release \
            --title "Latest Pre-release Build" \
            --notes-file release_body.md \
            --prerelease \
            --target "${{ github.sha }}" \
            $(cat ordered_files.txt)
